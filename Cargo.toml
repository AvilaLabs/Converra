[workspace]
members = [
    "crates/optcoil-model",
    "crates/optcoil-physics",
    "crates/optcoil-search",
    "crates/optcoil-adapters",
    "crates/optcoil-cli",
    "crates/optcoil-app",
]
default-members = ["crates/optcoil-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Avila Labs"]
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4"
ed25519-dalek = "2.1"
eframe = { version = "0.36.1", features = ["glow"] }
egui_extras = { version = "0.36.1", default-features = false }
egui_plot = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
optcoil-model = { path = "crates/optcoil-model" }
optcoil-physics = { path = "crates/optcoil-physics" }
optcoil-search = { path = "crates/optcoil-search" }
optcoil-adapters = { path = "crates/optcoil-adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Numerics-heavy workspace: an unoptimized dev build runs the field
# kernel ~20-50× slower and makes the egui workbench visibly laggy.
# opt-level 2 keeps debug symbols and incremental builds while removing
# the dominant runtime cost of `cargo run` / `cargo test`.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
