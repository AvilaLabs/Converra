[package]
name = "optcoil-app"
description = "OptCoil egui engineering workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "optcoil-app"
path = "src/main.rs"

[lib]
name = "optcoil_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
image.workspace = true
rfd = { workspace = true, features = ["file-handle-inner"] }
serde_json.workspace = true
serde.workspace = true
base64 = "0.22.1"
sha2.workspace = true
optcoil-model.workspace = true
optcoil-physics.workspace = true
optcoil-search.workspace = true
optcoil-adapters.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
avila-suite = { path = "/home/connoravila/Documents/Avila-Labs/development/avila-suite-web", default-features = false, features = ["ui"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "DedicatedWorkerGlobalScope", "HtmlCanvasElement", "HtmlElement", "MessageEvent", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"] }
# std::time::Instant does not exist in the browser — web-time supplies
# the drop-in performance.now() implementation.
web-time = "1"

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
