<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Converra workbench</title>
  <link data-trunk rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link data-trunk rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link data-trunk rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- The cdylib artifact is the wasm entry point; the bin stays native-only. -->
  <link data-trunk rel="rust" data-target-name="optcoil_app" data-wasm-opt="z">
  <!-- The search worker script — a static module the app spawns via
       `new Worker('./worker.js', {type:'module'})`. -->
  <link data-trunk rel="copy-file" href="worker.js">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F8FC; }
    #converra_canvas { width: 100%; height: 100%; display: block; }
    #converra-loading {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #1800AD; font-family: monospace;
    }
  </style>
</head>
<body>
  <!-- eframe renders into this canvas; the wasm bundle is injected by trunk. -->
  <canvas id="converra_canvas"></canvas>
  <div id="converra-loading">loading converra…</div>
  <script>
    // Remove the loading veil once the canvas has its first painted frame.
    const observer = new MutationObserver(() => {
      const canvas = document.getElementById('converra_canvas');
      if (canvas && canvas.width > 0) {
        const veil = document.getElementById('converra-loading');
        if (veil) veil.remove();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('converra_canvas'), { attributes: true });
  </script>
</body>
</html>
